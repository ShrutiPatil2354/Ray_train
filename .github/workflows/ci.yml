name: CPU CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          grep -v '^torch==' requirements.txt > requirements-ci.txt
          python -m pip install -r requirements-ci.txt
      - name: Syntax and import checks
        run: python -m compileall -q src ray_train_demo.py verify_project.py
      - name: Create SQLite database from tracked raw data
        run: python -c "from src.data_ingestion import create_database; create_database('data/bike_sharing.db')"
      - name: Run tests
        run: python -m pytest -q
      - name: Lightweight project verification
        run: python verify_project.py --cpu